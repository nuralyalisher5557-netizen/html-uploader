<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Загрузчик</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<header class="topbar">

    <div class="author">
        Автор: <span>Ваше имя</span>
    </div>


    <nav>

        <button class="nav-button active">
            HTML Загрузчик
        </button>

  <button class="nav-button" id="imagesNavBtn">
    🖼️ Изображения
</button>

        <button class="nav-button">
            3D-модели
        </button>

  <button class="nav-button" id="audioNavBtn">
    🎵 Аудио
</button>

    </nav>

</header>



<main>

<section class="card">

    <h1>
        HTML Загрузчик
    </h1>

    <p class="subtitle">
        Вставьте HTML-код и создайте готовый файл
    </p>

<div class="project-name-box">
    <label for="projectTitle">Название проекта</label>
    <input
        id="projectTitle"
        type="text"
        placeholder="Например: HISTORYPOLY"
    >
</div>

    <div class="editor-box">

        <button
            id="pasteBtn"
            class="paste-button"
        >
            📋 Вставить
        </button>


        <textarea
            id="htmlCode"
            placeholder="Вставьте ваш HTML код сюда..."
        ></textarea>
<div class="buttons">
    <button id="previewBtn">👁 Предпросмотр</button>
    <button id="downloadBtn">⬇ Скачать HTML</button>
    <button id="publishBtn">☁ Опубликовать</button>
</div>
    </div>



    <div id="publishResult" class="publish-result" style="display: none;">
    <h3>✅ Сайт опубликован!</h3>

    <input
        id="publishedUrl"
        type="text"
        readonly
    >

    <div class="publish-actions">
        <button id="openPublishedBtn">
            🌐 Открыть сайт
        </button>

        <button id="copyPublishedBtn">
            📋 Скопировать ссылку
        </button>
    </div>
</div>

<div id="imageUploader" style="display:none; margin-top:30px;">

    <h2>🖼️ Загрузчик изображений</h2>

    <p>Загрузите изображение и получите готовую ссылку</p>

    <input
        type="file"
        id="imageFile"
        accept="image/*"
    >

    <button id="uploadImageBtn">
        ⬆ Загрузить изображение
    </button>

    <p id="imageUploadStatus"></p>

    <div id="imageResult" style="display:none;">
        <h3>✅ Изображение загружено</h3>

        <input
            type="text"
            id="imageUrl"
            readonly
        >

        <button id="copyImageUrlBtn">
            📋 Копировать ссылку
        </button>
    </div>

</div>
<div id="audioUploader" style="display:none; margin-top:30px;">

    <h2>🎵 Загрузчик аудио</h2>
    <p>Загрузите аудиофайл и получите готовую ссылку</p>

    <input
        type="file"
        id="audioFile"
        accept="audio/*"
    >

    <button id="uploadAudioBtn">
        ⬆ Загрузить аудио
    </button>

    <p id="audioUploadStatus"></p>

    <div id="audioResult" style="display:none;">
        <h3>✅ Аудио загружено</h3>

        <audio id="audioPlayer" controls></audio>

        <input
            type="text"
            id="audioUrl"
            readonly
        >

        <button id="copyAudioUrlBtn">
            📋 Копировать ссылку
        </button>
    </div>

</div>
    <div
        id="previewSection"
        class="preview-section"
    >

        <h2>
            Предпросмотр
        </h2>


        <iframe
            id="previewFrame"
            sandbox="allow-scripts"
        ></iframe>

    </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=2"></script>

</body>

</html>
